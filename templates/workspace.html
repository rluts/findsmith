<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace · FindSmith</title>
  <style>
    :root { color-scheme: dark; --bg: #101416; --panel: #1d2324; --ink: #f5f3ed; --muted: #a9afad; --accent: #e8ff5b; --line: #3a4142; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 40px; }
    a { color: inherit; text-underline-offset: 4px; }
    .muted { color: var(--muted); }
    .panel { border: 1px solid var(--line); background: var(--panel); padding: 24px; margin-bottom: 24px; }
    form { display: flex; gap: 12px; }
    input, select { flex: 1; min-width: 0; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 13px; }
    button { border: 0; background: var(--accent); color: #151800; font-weight: 800; padding: 13px 20px; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; }
    li + li { border-top: 1px solid var(--line); }
    .project { display: flex; justify-content: space-between; gap: 20px; padding: 18px 0; text-decoration: none; }
    .empty { color: var(--muted); margin: 0; }
    @media (max-width: 600px) { header, form, .project { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Workspace</h1>
        <div class="muted">{{ username }}</div>
      </div>
      <a href="/">FindSmith</a>
    </header>
    <section class="panel">
      <h2>Create project</h2>
      <form action="/projects" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input name="name" maxlength="255" required placeholder="Project name" aria-label="Project name">
        <select name="wiki_id" aria-label="Wiki"><option value="ukwiki">Ukrainian Wikipedia (ukwiki)</option></select>
        <button type="submit">Create</button>
      </form>
    </section>
    <section class="panel">
      <h2>Projects</h2>
      {% if projects.is_empty() %}
        <p class="empty">No projects yet.</p>
      {% else %}
        <ul>
          {% for project in projects %}
            <li><a class="project" href="/projects/{{ project.id }}"><strong>{{ project.name }}</strong><span class="muted">v{{ project.state_version }}</span></a></li>
          {% endfor %}
        </ul>
      {% endif %}
    </section>
  </main>
</body>
</html>
