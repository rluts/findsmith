[package]
name = "findsmith"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
description = "Find and Replace Tool"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private", "form"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
configparser = "3.2.0"
mwapi = "0.8.0-rc.1"
mwoauth = { version = "0.1.0-alpha.1", features = ["axum"] }
regex = "1.12.3"
sea-orm = { version = "2.0.2", default-features = false, features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-json", "with-chrono"] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2.7.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.11", features = ["timeout"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
